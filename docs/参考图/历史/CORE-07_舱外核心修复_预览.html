<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CORE-07 / EVA Core Repair</title>
<style>*{box-sizing:border-box}body{margin:0;background:#d9e4ef;color:#375472;font-family:monospace}main{max-width:1440px;margin:auto;padding:20px}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}h1{font-size:18px;margin:0 16px 0 0}button{font:inherit;border:1px solid #8ba4b9;color:#375472;background:#e5eff6;padding:9px 12px;cursor:pointer}button[aria-pressed=true]{background:#375472;color:#edf6fa}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #e7a975;outline-offset:3px}label{display:flex;align-items:center;gap:6px}img{display:block;width:100%;height:auto;image-rendering:pixelated;border:1px solid #8ba4b9}footer{font-size:12px;margin-top:12px;color:#617e99;display:flex;gap:24px;flex-wrap:wrap}a{color:#375472}</style>
<main><header><h1>CORE-07 / EVA REPAIR</h1><button data-phase="1" aria-pressed="false">01 RECONNECT</button><button data-phase="2" aria-pressed="false">02 REBUILD</button><button data-phase="3" aria-pressed="true">03 STABILIZE</button><button data-phase="4" aria-pressed="false">04 RECHARGE</button><label><input id="comms" type="checkbox">SIMULATE COMMS</label></header>
<img id="art" src="../pixel-art/core07-eva-v6/out/phase_3_2x.png" alt="First-person EVA repair on a spacecraft hull. Pressure gloves, a quiet solar-system background, one shared puzzle field, side-specific NEXT slots, and an articulated energy column.">
<footer><span>PIXEL CONCEPT / NOT FPGA OUTPUT / COMMS TOGGLE IS A SUBTITLE SIMULATION</span><a href="../pixel-art/core07-eva-v6/out/four_phases_2x.png">FOUR PHASES</a><a id="master" href="../pixel-art/core07-eva-v6/out/phase_3_1x.png">1x MASTER</a></footer></main>
<script>let phase=3;const comms=document.getElementById('comms');function render(){document.getElementById('art').src=`pixel-art/core07-eva-v6/out/phase_${phase}${comms.checked?'_comms':''}_2x.png`;document.getElementById('master').href=`pixel-art/core07-eva-v6/out/phase_${phase}_1x.png`;document.querySelectorAll('[data-phase]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.phase)===phase)))}document.querySelectorAll('[data-phase]').forEach(b=>b.addEventListener('click',()=>{phase=Number(b.dataset.phase);render()}));comms.addEventListener('change',render);</script>
</html>
